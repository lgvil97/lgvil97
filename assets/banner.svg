<circle r="4" fill="#EAF2FF"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#tr1"/></animateMotion></circle>
<circle r="4" fill="#EAF2FF"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#tr2"/></animateMotion></circle>
