<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Gerardo Vilchis, AI/ML Engineer and Data Scientist">
<title>Gerardo Vilchis, AI/ML Engineer and Data Scientist</title>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
  
  @keyframes type {
    0% { transform: scaleX(0); }
    9.00% { transform: scaleX(1); }
    19.40% { transform: scaleX(1); }
    20.00%, 100% { transform: scaleX(0); }
  }
  .typer { transform-origin: 56px 0; transform: scaleX(0);
           animation: type 20s steps(36, end) infinite backwards; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="900" height="290" rx="16" fill="#0B1B3A"/>

<text x="56" y="120" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#EAF2FF">Gerardo Vilchis</text>
<text x="56" y="162" font-size="21" fill="#A9BEDF">AI/ML Engineer · Data Scientist · León, Mexico</text>
<clipPath id="t0"><rect class="typer" style="animation-delay:0s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t0)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">I ship LLM agents to production.</text>
<clipPath id="t1"><rect class="typer" style="animation-delay:4s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t1)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">Multi-agent systems on Databricks.</text>
