<text clip-path="url(#t2)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">Self-hosted AI on zero-trust infra.</text>
<clipPath id="t3"><rect class="typer" style="animation-delay:12s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t3)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">RAG that cites its sources.</text>
<clipPath id="t4"><rect class="typer" style="animation-delay:16s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t4)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">From firmware in C to GenAI.</text>

