<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Gerardo Vilchis, AI/ML Engineer and Data Scientist">
<title>Gerardo Vilchis, AI/ML Engineer and Data Scientist</title>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
  
  @keyframes type {
    0% { transform: scaleX(0); }
    11.25% { transform: scaleX(1); }
    24.25% { transform: scaleX(1); }
    25.00%, 100% { transform: scaleX(0); }
  }
  .typer { transform-origin: 56px 0; transform: scaleX(0);
           animation: type 16s steps(36, end) infinite backwards; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="900" height="290" rx="16" fill="#0B1B3A"/>

<text x="56" y="120" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#EAF2FF">Gerardo Vilchis</text>
<text x="56" y="162" font-size="21" fill="#A9BEDF">AI/ML Engineer · Data Scientist · León, Mexico</text>
<clipPath id="t0"><rect class="typer" style="animation-delay:0s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t0)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">I ship LLM agents to production.</text>
<clipPath id="t1"><rect class="typer" style="animation-delay:4s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t1)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">Multi-agent systems on Databricks.</text>
<clipPath id="t2"><rect class="typer" style="animation-delay:8s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t2)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">RAG that cites its sources.</text>
<clipPath id="t3"><rect class="typer" style="animation-delay:12s" x="56" y="196" width="540" height="40"/></clipPath>
<text clip-path="url(#t3)" x="56" y="224" font-size="24" font-weight="600" fill="#4EA8FF">From firmware in C to GenAI.</text>

<g fill="none" stroke="#2C5DB8" stroke-width="3" stroke-linejoin="round">
  <path id="tr0" d="M656 134 H700 L730 104 V80 H788"/>
  <path id="tr1" d="M656 150 H788"/>
  <path id="tr2" d="M656 166 H700 L730 196 V220 H788"/>
  <path d="M588 134 H600"/> <path d="M588 150 H600"/> <path d="M588 166 H600"/>
  <path d="M616 110 V122"/><path d="M616 178 V190"/> <path d="M628 110 V122"/><path d="M628 178 V190"/> <path d="M640 110 V122"/><path d="M640 178 V190"/>
</g>
<rect x="600" y="122" width="56" height="56" rx="6" fill="#152C55" stroke="#4EA8FF" stroke-width="2"/>
<text x="628" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#EAF2FF">DSPy</text>
<circle cx="800" cy="80" r="12" fill="#0B1B3A" stroke="#4EA8FF" stroke-width="3"/>
<circle cx="800" cy="80" r="4" fill="#4EA8FF"/>
<text x="820" y="85" font-size="14" font-weight="600" fill="#A9BEDF">P&amp;L</text>
<circle cx="800" cy="150" r="12" fill="#0B1B3A" stroke="#4EA8FF" stroke-width="3"/>
<circle cx="800" cy="150" r="4" fill="#4EA8FF"/>
<text x="820" y="155" font-size="14" font-weight="600" fill="#A9BEDF">RTM</text>
<circle cx="800" cy="220" r="12" fill="#0B1B3A" stroke="#4EA8FF" stroke-width="3"/>
<circle cx="800" cy="220" r="4" fill="#4EA8FF"/>
